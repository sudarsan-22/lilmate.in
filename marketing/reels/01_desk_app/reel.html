<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lil.mate Desk · reel 01</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Reel 01: lil.mate Desk. 1080x1920. Every frame is a pure function of time: render(t) sets everything.
   No CSS transitions or animations, so headless frame capture is exact. The island copies the real app's look
   (software/lilmate_desk/renderer/style.css) and its spring numbers (app.js: OPEN 190/21, CLOSE 1100/66). */
:root{--cream:#fff8ee;--cream2:#f7ecdb;--cream3:#efdfc6;--ink:#24130f;--soft:#6b5a4f;--mute:#9a8878;--orange:#f7931e;--pengu:#5b7397;--green:#3f9b63;--white:#fff;
  --line:rgba(36,19,15,.08);--line2:rgba(36,19,15,.14);--sh:0 10px 30px -12px rgba(36,19,15,.18)}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font:600 14px/1.4 Nunito,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,b,.word,.cap{font-family:Fredoka,system-ui,sans-serif}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stage{position:absolute;inset:0;overflow:hidden;background:#0b0706}
.shot{position:absolute;inset:0;overflow:hidden;opacity:0}

/* ---------- logo mark */
.mark{overflow:visible;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mark .head{stroke-width:5}.mark .eyes{stroke-width:4}.mark .eyes circle{stroke-width:3.4}
.mark .spark{stroke:var(--orange);stroke-width:5;transform-box:fill-box;transform-origin:0 100%}
.mark .eyes path{transform-box:fill-box;transform-origin:center}
.word{font-weight:600;letter-spacing:-.025em;line-height:1}.word i{font-style:normal;color:var(--orange)}

/* ---------- island (same look as the app) */
.island{position:absolute;top:0;left:50%;width:240px;height:42px;transform:translateX(-50%);background:var(--cream);
  border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px;overflow:hidden;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.18)}
.pill,.ask,.panel{position:absolute;top:0;left:50%;display:flex;transform-origin:50% 0}
.pill{width:238px;height:41px;align-items:center;gap:10px;padding:0 16px 0 14px}
.pill .mark{width:30px;height:22px;flex:none}
.pillText{flex:1;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none;display:inline-block}
.dot.ok{background:var(--green)}.dot.attn{background:var(--orange)}
.ask{width:458px;height:167px;flex-direction:column;gap:10px;padding:14px 18px 12px}
.askHead{display:flex;gap:12px;align-items:center}
.askHead .mark{width:36px;height:26px;flex:none}
.askHead b{display:block;font-size:17px;font-weight:600}.askHead small{color:var(--soft);font-size:12px}
.askCmd{display:flex;align-items:center;gap:9px;font:700 13px Nunito,sans-serif;color:var(--soft);background:var(--cream2);border-radius:12px;padding:8px 11px;white-space:nowrap;overflow:hidden}
.askRow{display:flex;gap:8px;align-items:center}
.btn{background:var(--ink);color:var(--cream);font-weight:700;border-radius:999px;padding:8px 22px;border:0;font:inherit;font-weight:700}
.btn2{border:1.5px solid var(--line2);border-radius:999px;padding:7px 18px;font-weight:700;white-space:nowrap;background:none;font:inherit;font-weight:700;color:var(--ink)}
.hint{color:var(--soft);font-size:12px;margin-left:auto}
.askCmd em{font-style:normal;background:var(--ink);color:var(--cream);border-radius:8px;padding:2px 8px;font-size:12px}
.ttl{height:3px;background:var(--cream2);border-radius:3px;overflow:hidden}.ttl i{display:block;height:100%;background:var(--orange);width:100%}
.panel{width:798px;height:519px;overflow:hidden}
aside{width:214px;flex:none;padding:18px 12px 14px;display:flex;flex-direction:column;gap:16px;background:var(--cream2);border-right:1px solid var(--line)}
.me{display:flex;flex-direction:column;gap:6px;padding:6px 8px 4px}
.brand{display:flex;align-items:flex-end;gap:9px}.brand .mark{width:38px;height:28px;flex:none}.brand .word{font-size:24px}
.me small{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:12px;padding-left:2px}
nav{display:flex;flex-direction:column;gap:3px}
nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:999px;color:var(--soft);font-weight:700}
nav a.on{background:var(--ink);color:var(--cream)}nav a.on svg{color:var(--orange)}
nav em{margin-left:auto;font-style:normal;font-size:11px;background:var(--cream3);color:var(--ink);border-radius:999px;padding:1px 8px;font-weight:800}
.pin{margin-top:auto;color:var(--soft);font-size:12px;padding:6px 12px}
main{flex:1;padding:24px 28px 18px;background:var(--cream);overflow:hidden}
h1{font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;margin:16px 0 8px}
.sub{color:var(--soft);margin:5px 0 14px}
.talk{display:flex;gap:8px;align-items:center;background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:5px 5px 5px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.talk span{flex:1;color:var(--mute);white-space:nowrap;overflow:hidden}
.talk i{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;flex:none}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:13px 13px 11px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--sh)}
.card i{width:22px;height:22px;border-radius:8px;display:block}
.c1{background:var(--pengu)}.c2{background:var(--orange)}.c3{background:var(--ink)}.c4{background:var(--cream3)}
.card b{font-size:25px;font-weight:600;line-height:1;white-space:nowrap}
.card span{font-size:12px;color:var(--soft);white-space:nowrap}
.chips{display:flex;flex-wrap:nowrap;gap:7px;margin-top:14px;align-items:center}
.chips>span{background:var(--white);border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-weight:700;white-space:nowrap;font-size:13px}
.list{list-style:none;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:9px 12px}
.list li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.list li.done span{text-decoration:line-through;color:var(--mute)}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--cream3);flex:none;display:grid;place-items:center}
.ck.on{background:var(--orange);border-color:var(--orange)}.ck.on::after{content:"";width:5px;height:9px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tag{font-size:11px;border-radius:999px;padding:2px 9px;background:var(--cream2);color:var(--soft);font-weight:800;font-style:normal;white-space:nowrap}
.tag.done{color:var(--green)}.tag.soon{color:#c46a00;background:#fde7cb}
.fly{position:absolute;top:0;left:50%;width:38px;height:28px;color:var(--ink);transform-origin:0 0;z-index:5}

/* ---------- desktop (inside the laptop, and the macro shots): light, like lilmate.in */
.desk{position:absolute;left:0;top:0;width:1440px;overflow:hidden;
  background:
    radial-gradient(55% 42% at 14% 18%,#cfe6ea,transparent 72%),
    radial-gradient(50% 40% at 88% 82%,#f6d9b5,transparent 72%),
    radial-gradient(35% 28% at 72% 22%,rgba(247,147,30,.16),transparent 72%),
    radial-gradient(45% 35% at 30% 95%,rgba(214,167,230,.22),transparent 72%),
    linear-gradient(160deg,#e8f1ef,#fbf3e7 55%,#f5e4cf)}
.win{position:absolute;left:90px;top:150px;width:760px;height:520px;border-radius:14px;background:rgba(255,255,255,.88);
  box-shadow:0 30px 60px -24px rgba(36,19,15,.28),0 0 0 1px rgba(36,19,15,.06);overflow:hidden}
.win .bar{height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(36,19,15,.035)}
.win .bar i{width:11px;height:11px;border-radius:50%;background:#e6d8c6}
.win .code{padding:22px 26px;display:flex;flex-direction:column;gap:11px}
.win .code u{display:block;height:9px;border-radius:5px;text-decoration:none}
.win2{left:900px;top:420px;width:440px;height:330px}
.win .doc{padding:34px 48px;display:flex;flex-direction:column;gap:13px}
.win .doc u{display:block;height:10px;border-radius:5px;background:#e3d6c6;text-decoration:none}
.win .doc u.t{height:22px;width:46%;background:#3a2a24;opacity:.8;margin-bottom:10px}
.win .doc u.gap{background:none;height:6px}
.win .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
.win .tiles i{height:128px;border-radius:10px;display:block}
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:12px;padding:10px 14px;border-radius:22px;
  background:rgba(255,255,255,.55);box-shadow:0 10px 30px -12px rgba(36,19,15,.25),inset 0 0 0 1px rgba(255,255,255,.7)}
.dock i{width:46px;height:46px;border-radius:12px;display:block}
.cursor{position:absolute;left:0;top:0;width:26px;height:38px;transform-origin:3px 3px;z-index:20;filter:drop-shadow(0 3px 5px rgba(36,19,15,.35))}

/* ---------- the buddy (Boxy render from lilmate.in) with eyes on its screen */
.buddy{position:absolute}
.buddy img{display:block;width:100%;height:100%}
.oled{position:absolute;left:29.3%;top:36.4%;width:42.3%;height:21.6%;border-radius:12% / 22%;background:#0b0b0d;box-shadow:inset 0 0 0 2px #1d1d21}
.beyes{position:absolute;left:29.3%;top:36.4%;width:42.3%;height:21.6%;overflow:visible}
.beyes *{fill:#fff;stroke:#fff}
.beyes .glow{filter:drop-shadow(0 0 4px rgba(255,255,255,.75)) drop-shadow(0 0 10px rgba(255,255,255,.35))}

/* ---------- laptop shot (CSS 3D), a bright desk */
#sLaptop{perspective:1800px;perspective-origin:540px 960px;
  background:radial-gradient(60% 34% at 50% 40%,#fffaf2 0%,#f7ebda 55%,#ead8bf 100%)}
.wallblob{position:absolute;border-radius:120px;filter:blur(38px)}
#rig{position:absolute;left:540px;top:960px;width:0;height:0;transform-style:preserve-3d}
#rig>*{position:absolute}
.lid{left:-480px;top:-620px;width:960px;height:620px;transform-origin:50% 100%;transform:rotateX(8deg);border-radius:26px 26px 8px 8px;
  background:#0d0d0f;box-shadow:inset 0 0 0 2px #6d6c72,inset 0 0 0 4px #1a1a1d;padding:26px 30px 32px}
.screen{position:relative;width:900px;height:562px;overflow:hidden;border-radius:4px;background:#000}
.screen .desk{height:900px;transform:scale(.625);transform-origin:0 0}
.glare{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 36%,rgba(255,255,255,0) 72%,rgba(255,255,255,.05) 100%);pointer-events:none}
.base{left:-500px;top:0;width:1000px;height:660px;transform-origin:50% 0;transform:rotateX(90deg);border-radius:6px 6px 28px 28px;
  background:linear-gradient(#8e8d93,#7a797f 55%,#6c6b71)}
.kbd{position:absolute;left:96px;top:60px;width:808px;height:300px;border-radius:12px;background:#2a292e;
  background-image:repeating-linear-gradient(90deg,transparent 0 6px,#3a393f 6px 54px,transparent 54px 60px),repeating-linear-gradient(0deg,transparent 0 6px,rgba(0,0,0,0) 6px 44px,#2a292e 44px 50px)}
.pad{position:absolute;left:330px;top:395px;width:340px;height:220px;border-radius:16px;background:#85848a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.baseglow{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(70% 55% at 50% 0%,rgba(255,255,255,.18),transparent 70%)}
.front{left:-500px;top:0;width:1000px;height:16px;transform:translateZ(660px);border-radius:0 0 14px 14px;background:linear-gradient(#a3a2a8,#5d5c62)}
.table{left:-2200px;top:16px;width:4400px;height:3200px;transform-origin:50% 0;transform:translateZ(-1400px) rotateX(90deg);
  background:radial-gradient(30% 22% at 50% 50%,rgba(255,255,255,.35),transparent 70%),linear-gradient(#e6d2b4,#ead9c0 45%,#dcc39f)}
.lshadow{left:-640px;top:12px;width:1280px;height:820px;transform-origin:50% 0;transform:translateZ(-40px) rotateX(90deg);
  background:radial-gradient(closest-side,rgba(70,40,20,.42),rgba(70,40,20,.18) 60%,transparent)}
.bshadow{left:480px;top:12px;width:330px;height:190px;transform-origin:50% 0;transform:translateZ(150px) rotateX(90deg);
  background:radial-gradient(closest-side,rgba(70,40,20,.45),transparent)}
.buddy3d{left:505px;top:-262px;width:270px;height:276px;transform-origin:50% 100%;transform:translateZ(230px) rotateY(-12deg)}

/* ---------- macro shots: the top of the screen, very close */
#sMacro{background:#f3e5d0}
#mcam{position:absolute;left:540px;top:0;width:0;height:0;transform-origin:0 0}
.mroom{position:absolute;left:-3000px;top:-3000px;width:6000px;height:2962px;background:radial-gradient(30% 22% at 50% 100%,#fffaf2,#f1e2cb 60%,#e6d1b3)}
.medge{position:absolute;left:-3000px;top:-40px;width:6000px;height:4px;background:linear-gradient(90deg,transparent,#8d8c92 30%,#b4b3b9 50%,#8d8c92 70%,transparent)}
.mbezel{position:absolute;left:-3000px;top:-36px;width:6000px;height:36px;background:#0d0d0f}
.mcam{position:absolute;left:-5px;top:-23px;width:10px;height:10px;border-radius:50%;background:#1b1b20;box-shadow:inset 0 0 0 2px #2a2930}
.mdesk{position:absolute;left:-720px;top:0}
.mdesk .desk{height:1800px;width:1440px}
.mscreen{position:absolute;left:-3000px;top:0;width:6000px;height:4000px;background:#f5ebdd}

/* ---------- hero / logo / end: the lilmate.in look */
#sTitle,#sLogo,#sEnd{background:radial-gradient(70% 45% at 50% 45%,#fffaf2,#fff8ee 60%,#f6ead8)}
.blob{position:absolute;border-radius:96px}
.chip{position:absolute;display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:14px 26px;font:700 30px/1 Nunito,sans-serif;color:var(--ink);
  box-shadow:0 14px 30px -12px rgba(36,19,15,.25),0 0 0 1px rgba(36,19,15,.05);white-space:nowrap}
.chip b{font:700 30px/1 Nunito,sans-serif}.chip .h{color:#ef5d7a}.chip .o{color:var(--orange)}
.eyebrow{position:absolute;left:50%;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.7);border:2px solid rgba(36,19,15,.07);border-radius:999px;
  padding:10px 26px 10px 12px;font:700 29px/1 Nunito,sans-serif;color:var(--soft);white-space:nowrap}
.badge{width:84px;height:44px;border-radius:999px;background:#0b0b0d;display:grid;place-items:center}
.badge svg{width:56px;height:24px;stroke:#fff;stroke-width:3.2}
.spark3{position:absolute;overflow:visible}
.spark3 path{stroke:var(--orange);stroke-width:5;stroke-linecap:round;fill:none}
.cap{position:absolute;left:0;width:1080px;text-align:center;color:var(--ink);font-weight:600;letter-spacing:-.025em;line-height:1.04}
.cap i{font-style:normal;color:var(--orange)}
.cap .eb{display:block;font:700 26px/1 ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;letter-spacing:.24em;color:var(--orange);margin-bottom:22px}
.cap.small{font-family:Nunito,system-ui,sans-serif;font-weight:700;letter-spacing:0;color:var(--soft)}
.cta{position:absolute;left:0;width:1080px;display:flex;justify-content:center;gap:20px}
.cta span{display:flex;align-items:center;gap:16px;border-radius:999px;padding:22px 40px;font:700 34px/1 Nunito,sans-serif;white-space:nowrap}
.cta .fill{background:var(--ink);color:var(--cream);padding-right:16px}
.cta .fill i{width:52px;height:52px;border-radius:50%;background:rgba(255,248,238,.16);display:grid;place-items:center;font-style:normal}
.cta .line{border:2.5px solid rgba(36,19,15,.16);color:var(--ink)}
.logoRow{position:absolute;left:0;width:1080px;display:flex;justify-content:center;align-items:flex-end;gap:22px}
.logoRow .mark{width:150px;height:106px;color:var(--ink)}
.logoRow .word{font-size:120px;color:var(--ink)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 62% at 50% 50%,transparent 60%,rgba(120,80,40,.16))}
#grain{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;mix-blend-mode:overlay;opacity:.05}
#fade{position:absolute;inset:0;background:#fff8ee;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="shot" id="sTitle"></div>
  <div class="shot" id="sLogo"><svg class="mark" id="bigMark" viewBox="0 -18 88 62"></svg></div>
  <div class="shot" id="sLaptop">
    <div class="wallblob" style="left:40px;top:330px;width:420px;height:480px;background:#cfe6ea;opacity:.8"></div>
    <div class="wallblob" style="left:650px;top:420px;width:380px;height:420px;background:#f1d7b4;opacity:.8"></div>
    <div id="rig">
      <div class="table"></div>
      <div class="lshadow"></div><div class="bshadow"></div>
      <div class="base"><div class="kbd"></div><div class="pad"></div><div class="baseglow"></div></div>
      <div class="front"></div>
      <div class="lid"><div class="screen" id="lapScreen"></div><div class="glare"></div></div>
      <div class="buddy buddy3d" id="lapBuddy"></div>
    </div>
  </div>
  <div class="shot" id="sMacro">
    <div id="mcam">
      <div class="mroom"></div>
      <div class="mscreen"></div>
      <div class="mdesk" id="macroDesk"></div>
      <div class="mbezel"></div><div class="medge"></div><div class="mcam"></div>
    </div>
    <div class="chip" id="mC1"><b class="o">+1</b> glass of water</div>
    <div class="chip" id="mC2"><b class="o">●</b> or hold your buddy</div>
  </div>
  <div class="shot" id="sEnd"><div class="logoRow" id="endLogo"><svg class="mark" id="endMark" viewBox="0 -18 88 62"></svg><span class="word">lil<i>.</i>mate</span></div><div class="cta" id="endCta"><span class="fill">Pre-order yours <i>→</i></span><span class="line">lilmate.in</span></div></div>
  <div id="caps"></div>
  <div id="vig"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="fade"></div>
</div>
<div id="measure" style="position:absolute;left:3000px;top:0;width:1440px;height:900px"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
function bez(x1, y1, x2, y2) {
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, u = .5;
    for (let i = 0; i < 40; i++) { u = (lo + hi) / 2; const cx = 3 * x1 * u * (1 - u) ** 2 + 3 * x2 * u * u * (1 - u) + u ** 3; if (cx < x) lo = u; else hi = u; }
    return 3 * y1 * u * (1 - u) ** 2 + 3 * y2 * u * u * (1 - u) + u ** 3; };
}
const eOut = bez(.2, .8, .2, 1), eIO = bez(.45, 0, .3, 1), eCam = bez(.6, 0, .25, 1), eSoft = bez(.3, .1, .3, 1), eFly = bez(.3, .85, .25, 1), ePop = bez(.3, 1.4, .5, 1);
const seg = (t, a, b, e = x => x) => e(clamp((t - a) / (b - a)));
// keyframe track: [[t, value], ...] with an easing per step
function track(t, keys, e = eCam) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const [t0, v0] = keys[i - 1], [t1, v1, ee] = keys[i], p = (ee || e)(clamp((t - t0) / (t1 - t0)));
    return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], p)) : lerp(v0, v1, p);
  }
  return keys[keys.length - 1][1];
}

// ------------------------------------------------------------ the logo (same paths as the app)
const EYE = {
  open: '<path d="M24.5 25.5V31"/><path d="M39.5 25.5V31"/>',
  happy: '<path d="M21 31Q24.5 25 28 31"/><path d="M36 31Q39.5 25 43 31"/>',
  sleepy: '<path d="M21 29.5H28"/><path d="M36 29.5H43"/>',
  alert: '<circle cx="24.5" cy="28.5" r="3.2"/><circle cx="39.5" cy="28.5" r="3.2"/>',
  focus: '<path d="M21 27.5L28 29.5"/><path d="M36 29.5L43 27.5"/>',
};
function face(el, eye) {
  if (el.dataset.k === eye) return; el.dataset.k = eye;
  el.innerHTML = '<path class="head" d="M6 40C6 18 18 6 32 6C46 6 58 18 58 40"/><g class="eyes">' + EYE[eye] + '</g>' +

    <div class="blob" id="hB1" style="left:190px;top:860px;width:580px;height:660px;background:#f2dcc0"></div>
    <svg class="spark3" id="hSp" viewBox="0 0 40 32" style="left:770px;top:800px;width:110px;height:88px"><path d="M14 4L11 15"/><path d="M30 9L21 18"/><path d="M36 25L25 28"/></svg>
    <div class="buddy" id="hBuddy" style="left:215px;top:880px;width:650px;height:665px"></div>
    <div class="chip" id="hC1"><b class="h">♥</b> heart eyes</div>
    <div class="chip" id="hC2"><b class="o">z z</b> naps too</div>
    <div class="chip" id="hC3"><b class="o">●</b> tap my head</div>
  </div>`;
  HERO = { eyes: buildBuddy($('#hBuddy')) };
  [['#hC1', 90, 930], ['#hC2', 720, 1180], ['#hC3', 80, 1480]].forEach(([id, x, y]) => Object.assign($(id).style, { left: x + 'px', top: y + 'px' }));
}
function pop(el, t, a, extra = '') { const p = seg(t, a, a + .55, ePop), o = seg(t, a, a + .25); el.style.opacity = o; el.style.transform = `${extra} scale(${lerp(.6, 1, p)})`; }
function drawTitle(t) {
  const out = seg(t, 2.95, 3.4, eIO);
  show('#sTitle', 1 - out, `blur(${(14 * out).toFixed(2)}px)`);
  if (out >= 1) return;
  $('#heroIn').style.transform = `scale(${1 + .03 * seg(t, 0, 3.4, eSoft) + .06 * out})`;
  const eb = $('#hEb'), ep = eOut(seg(t, .15, .75));
  eb.style.top = '330px'; eb.style.opacity = ep; eb.style.transform = `translateX(-50%) translateY(${16 * (1 - ep)}px)`; eb.style.filter = `blur(${8 * (1 - ep)}px)`;
  for (const [id, a, r] of [['#hB1', .35, -7], ['#hB2', .5, 9]]) { const p = eOut(seg(t, a, a + .9)); const el = $(id);
    el.style.opacity = seg(t, a, a + .3); el.style.transform = `rotate(${r * p}deg) scale(${lerp(.82, 1, p)})`; }
  const bp = eOut(seg(t, .55, 1.35)), bob = 4 * Math.sin(t * 2.2);
  Object.assign($('#hBuddy').style, { opacity: seg(t, .55, .85), transform: `translateY(${90 * (1 - bp) + bob}px)`, filter: 'drop-shadow(0 30px 30px rgba(36,19,15,.25))' });
  pop($('#hSp'), t, 1.25);
  pop($('#hC1'), t, 1.3, `translateY(${5 * Math.sin(t * 2.6)}px)`); pop($('#hC2'), t, 1.45, `translateY(${5 * Math.sin(t * 2.3 + 1)}px)`); pop($('#hC3'), t, 1.6, `translateY(${5 * Math.sin(t * 2.0 + 2)}px)`);
  const blink = t > 1.62 && t < 1.78 ? Math.sin(Math.PI * (t - 1.62) / .16) : 0, look = eOut(seg(t, 2.05, 2.4));
  buddyEyes(HERO.eyes, t > 2.55 ? 'happy' : 'open', blink, 0, -26 * look);
}

function drawEnd(t) {
  const o = seg(t, 18.5, 19.0, eSoft);
  show('#sEnd', o, null); if (o <= 0) return;
  const L = $('#endLogo'), p = eOut(seg(t, 18.75, 19.5));
  Object.assign(L.style, { top: '640px', opacity: p, transform: `translateY(${30 * (1 - p)}px) scale(${.94 + .06 * p})`, filter: `blur(${10 * (1 - p)}px)` });
  const m = $('#endMark'); face(m, t < 20.75 ? 'open' : t < 20.88 ? 'sleepy' : 'happy'); sparkPop(m, (t - 20.9) / .45);
  const c = $('#endCta'), cp = eOut(seg(t, 19.95, 20.6));
  Object.assign(c.style, { top: '1310px', opacity: cp, transform: `translateY(${24 * (1 - cp)}px)`, filter: `blur(${8 * (1 - cp)}px)` });
}

// ------------------------------------------------------------ film grain + vignette
const grains = [];
function makeGrain() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let g = 0; g < 8; g++) { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'), d = x.createImageData(540, 960);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (rnd() - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0); grains.push(c); }
}

// ------------------------------------------------------------ one frame
window.render = t => {
  drawTitle(t); drawLogo(t); drawLaptop(t); drawMacro(t); drawEnd(t); drawCaps(t);
  const g = $('#grain').getContext('2d'); g.drawImage(grains[Math.floor(t * 30) % grains.length], 0, 0);
  $('#fade').style.opacity = 1 - seg(t, 0, .3);
};

window.setup = async () => {
  await document.fonts.ready;
  await Promise.all(['assets/minimo.png'].map(src => new Promise(r => { const i = new Image(); i.onload = r; i.src = src; })));
  $('#lapScreen').innerHTML = DESK(900).replace('<div class="desk"', '<div class="desk" id="lapDesk"');
  LAP = buildIsland($('#lapDesk'), 720);
  LAP.buddy = buildBuddy($('#lapBuddy'));
  buildHero();
  $('#macroDesk').innerHTML = DESK(1800);
  MAC = buildIsland($('#mcam'), 0);
  $('#mcam').appendChild(MAC.wrap);
  // measure where the logo, the water tick and Allow sit, on an unscaled copy
  const M = buildIsland($('#measure'), 720), isl = () => M.el.getBoundingClientRect();
  const at = (el, mode) => { const tt = { pill: 0, panel: 9, ask: 14 }[mode]; drawIsland(M, tt); const a = isl(), b = el.getBoundingClientRect();
    return [b.left - (a.left + a.width / 2), b.top - a.top, b.width, b.height]; };
  POS.ck = (([x, y, w, h]) => [x + w / 2, y + h / 2])(at(M.ck, 'panel'));
  POS.allow = (([x, y, w, h]) => [x + w * .45, y + h * .55])(at(M.allow, 'ask'));
  // the hopping logo sits at the panel logo's spot; its translate starts at the pill logo's spot
  const pf = at(M.pf, 'pill'), bf = at(M.bf, 'panel');
  MAC.fly.style.left = LAP.fly.style.left = `calc(50% + ${bf[0]}px)`; MAC.fly.style.top = LAP.fly.style.top = bf[1] + 'px';
  POS.pfx = pf[0] - bf[0]; POS.pfy = pf[1] - bf[1]; POS.bfx = 0; POS.bfy = 0;
  $('#measure').remove();
  headLen = Math.ceil($('.head', (face($('#bigMark'), 'open'), $('#bigMark'))).getTotalLength()) + 2;
  makeGrain();
  return POS;
};
